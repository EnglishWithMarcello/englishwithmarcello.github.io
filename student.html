<title>English With Marcello</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f5f6fa; color: #1a1a2e; }
.wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 56px; }
.hero { background: #fff; border: 1.5px solid #e8e8e8; border-radius: 14px; padding: 28px; text-align: center; margin-bottom: 18px; }
.hero img { height: 54px; border-radius: 8px; margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto; }
.hero h1 { color: #1a2357; font-size: 0.9rem; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
.hero .stu { color: #4a9b8e; font-size: 1.2rem; font-weight: 900; }
.card { background: #fff; border: 1.5px solid #e8e8e8; border-radius: 13px; padding: 22px 24px; margin-bottom: 16px; }
.card-lbl { font-size: 0.68rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 13px; padding-bottom: 10px; border-bottom: 1px solid #f0f0f0; }
.ro { font-size: 0.97rem; font-weight: 600; color: #1a2357; }
.ctrs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ctr { border-radius: 11px; padding: 18px; text-align: center; }
.ctr.teal { background: #4a9b8e; }
.ctr.red { background: #cc2222; }
.ctr-lbl { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 7px; color: rgba(255,255,255,0.7); }
.ctr-val { font-size: 2.6rem; font-weight: 900; color: #fff; line-height: 1; }
table { width: 100%; border-collapse: collapse; }
thead tr { background: #f5f6fa; }
th { font-size: 0.66rem; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 1.5px; padding: 10px 13px; text-align: left; }
th:first-child { border-radius: 8px 0 0 8px; }
th:last-child { border-radius: 0 8px 8px 0; }
td { padding: 9px 13px; font-size: 0.9rem; border-bottom: 1px solid #f0f0f0; color: #444; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr.done td { background: #f0faf8; }
tr.done td:first-child strong { color: #4a9b8e; }
td.chk-cell { text-align: center; }
.date-cell { font-size: 0.88rem; color: #555; }
.done-icon { display: inline-block; width: 22px; height: 22px; border-radius: 5px; border: 2px solid #ddd; background: #fff; vertical-align: middle; position: relative; }
.done-icon.checked { background: #4a9b8e; border-color: #4a9b8e; }
.done-icon.checked::after { content: ''; position: absolute; left: 5px; top: 2px; width: 8px; height: 12px; border: 2.5px solid #fff; border-top: none; border-left: none; transform: rotate(40deg); }
.pkgs { display: flex; gap: 12px; flex-wrap: wrap; }
.pkg { flex: 1; min-width: 140px; border: 1.5px solid #e8e8e8; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.15s; text-decoration: none; display: block; }
.pkg:hover { border-color: #1a2357; }
.pkg-n { font-size: 1rem; font-weight: 800; color: #1a2357; }
.pkg-p { font-size: 0.9rem; color: #4a9b8e; font-weight: 700; margin-top: 3px; }
.footer { text-align: center; margin-top: 24px; }
.footer a { color: #1a2357; font-weight: 800; text-decoration: none; font-size: 0.85rem; }
.err { text-align: center; padding: 60px 20px; color: #aaa; font-size: 0.9rem; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var SUPABASE_URL='https://vtvreizedxkppvhllyqx.supabase.co';
var SUPABASE_KEY='sb_publishable_8IXT4zxCGSCOpYiK8XdP3g_1pYcfWLB';
window.onload=async function(){
  var params=new URLSearchParams(window.location.search);
  var token=params.get('s');
  if(!token){document.getElementById('errBox').style.display='block';return;}
  var d;
  try{
    var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var res=await sb.rpc('get_student_dashboard',{p_token:token});
    if(res.error||!res.data||!res.data.length){document.getElementById('errBox').style.display='block';return;}
    d=res.data[0];
  }catch(e){document.getElementById('errBox').style.display='block';return;}
  document.getElementById('main').style.display='block';
  document.getElementById('stuName').textContent=d.name||'';
  document.getElementById('stuEmail').textContent=d.email||'';
  document.getElementById('stuPaid').textContent=d.paid||0;
  var lessons=d.lessons||[];
  var done=lessons.filter(function(l){return l.done;}).length;
  var rem=(typeof d.remaining==='number')?d.remaining:Math.max(0,(d.paid||0)-done);
  document.getElementById('stuRim').textContent=rem;
  var tb=document.getElementById('tbody');
  for(var i=0;i<lessons.length;i++){
    var l=lessons[i];
    var isDone=l.done?true:false;
    var tr=document.createElement('tr');
    if(isDone)tr.className='done';
    var ds='';
    if(l.date){try{var p=l.date.split('-');ds=p[2]+'/'+p[1]+'/'+p[0];}catch(e){ds=l.date;}}
    tr.innerHTML='<td><strong>'+(i+1)+'</strong></td><td class="date-cell">'+esc(ds)+'</td><td class="chk-cell"><span class="done-icon'+(isDone?' checked':'')+'"></span></td>';
    tb.appendChild(tr);
  }
};
</script>
